<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" fill="none">
  <defs>
    <linearGradient id="cyanPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0099b8" />
    </linearGradient>
    <filter id="cyanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 'Skill' in bright white -->
  <text x="2" y="48" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1.5">Skill</text>

  <!-- 'Expo' in signature cyan -->
  <text x="122" y="48" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#00E5FF" letter-spacing="-1.5" filter="url(#cyanGlow)">Expo</text>

  <!-- Rounded capsule pill: 'PHASE 3' -->
  <g transform="translate(252, 14)">
    <rect width="118" height="38" rx="19" fill="url(#cyanPillGrad)" filter="url(#cyanGlow)" />
    <text x="59" y="24.5" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#050508" text-anchor="middle" letter-spacing="1.5">PHASE 3</text>
  </g>
</svg>
